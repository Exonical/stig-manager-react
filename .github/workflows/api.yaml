name: api

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'docs/openapi/**'
      - '.github/workflows/api.yaml'
  pull_request:
    paths:
      - 'api/**'
      - 'docs/openapi/**'
      - '.github/workflows/api.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.3'

jobs:
  build:
    name: vet, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api/go.sum

      - name: Go module verify
        run: go mod download && go mod verify

      - name: Verify generated code is up to date
        run: |
          go generate ./internal/api
          if ! git diff --quiet -- internal/api; then
            echo "::error::generated code is out of date — run 'go generate ./internal/api' from api/ and commit"
            git --no-pager diff -- internal/api
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: |
          mkdir -p ../bin
          CGO_ENABLED=0 go build -trimpath -o ../bin/stigman ./cmd/stigman

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: stigman-linux-amd64
          path: bin/stigman
          if-no-files-found: error
          retention-days: 14
