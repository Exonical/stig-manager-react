# Local development & demo compose stack.
#
# Brings up:
#   - Postgres 18              (port 5432)
#   - Keycloak (dev mode)      (port 8080)
#   - API (Go)                 (port 54001)
#   - Web (Vite preview)       (port 54000)
#
# Real production deploys will use the artifacts published in Milestone 4.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stigman
      POSTGRES_PASSWORD: stigman
      POSTGRES_DB: stigman
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stigman -d stigman"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  keycloak:
    # Custom image that bakes deploy/keycloak/stigman-realm.json into
    # /opt/keycloak/data/import/ at build time. See deploy/keycloak/Containerfile
    # for why we don't bind-mount the realm directory.
    build:
      context: ../keycloak
      dockerfile: Containerfile
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin the issuer (and the front-channel base URL) so tokens
      # signed for the SPA carry `iss: http://localhost:8080/...`
      # no matter which hostname the request arrived under. The API
      # reaches Keycloak via the in-network `keycloak:8080` hostname;
      # `KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true` keeps that backchannel
      # call working while the issuer claim itself stays stable.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/localhost/9000 && echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n" >&3 && grep -q "\"status\": \"UP\"" <&3'
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ../../api
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STIGMAN_HTTP_ADDR: ":54001"
      STIGMAN_DATABASE_URL: postgres://stigman:stigman@postgres:5432/stigman?sslmode=disable
      STIGMAN_ALLOWED_ORIGINS: http://localhost:54000,http://127.0.0.1:54000
      STIGMAN_LOG_LEVEL: info
      # OIDC — access tokens carry `iss: http://localhost:8080/...`
      # (pinned via Keycloak's KC_HOSTNAME above) because the SPA
      # bootstraps the PKCE flow against the browser-facing URL.
      # Inside the compose network the API still reaches Keycloak via
      # the service hostname for discovery + JWKS, hence the split.
      STIGMAN_OIDC_PROVIDER: http://localhost:8080/realms/stigman
      STIGMAN_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/stigman
      STIGMAN_OIDC_AUDIENCE: stig-manager
      STIGMAN_CLIENT_ID: stig-manager
    ports:
      - "54001:54001"

  web:
    build:
      context: ../..
      dockerfile: web/Containerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "54000:80"

volumes:
  postgres-data:
