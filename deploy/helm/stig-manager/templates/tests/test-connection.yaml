apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stig-manager.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stig-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - |
          set -eu
          echo "Probing API /health endpoint..."
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "http://{{ include "stig-manager.api.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.service.port }}/health"
          echo
          echo "Probing web SPA root..."
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            -o /dev/null \
            "http://{{ include "stig-manager.web.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.web.service.port }}/"
          echo "All probes succeeded."
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
