<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>STIG Manager</title>
    <!--
      /js/Env.js is rendered by the API at runtime and exposes
      window.STIGMAN.Env (OIDC issuer, client id, scopes, version).
      Placed in <head> so it runs before the React bundle, which is
      hoisted to <head> by Vite during the production build. Module
      scripts have implicit defer, so a classic script in the body
      can lose this race in headless browsers; pinning it here keeps
      bootstrap deterministic.
    -->
    <script src="/js/Env.js"></script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
