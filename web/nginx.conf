server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets are content-hashed by Vite, so we can cache them forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy /api/* to the Go backend within the compose network.
  location /api/ {
    proxy_pass http://api:54001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — every other route serves index.html so client-side
  # routing works for deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
